<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Банкаар төлөх — Кино үзвэр</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:22px 18px 40px;background:#0d0f14;color:#e8eaf0;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
  .wrap{max-width:380px;margin:0 auto}
  h1{font-size:17px;margin:0 0 4px;text-align:center}
  p.sub{font-size:12.5px;color:#8792a6;text-align:center;margin:0 0 18px}
  .card{background:rgba(0,132,255,.07);border:1.5px solid rgba(0,132,255,.45);
        border-radius:14px;padding:14px}
  .foot{font-size:11px;color:#8792a6;text-align:center;margin-top:14px;line-height:1.5}
  .load{text-align:center;padding:50px 0;color:#8792a6;font-size:13px}
  .lbl{font:700 11px -apple-system,sans-serif;fill:#6ab7ff}
  .txt{font:500 10px -apple-system,sans-serif;fill:#c9d2e0}
  .dim{font:500 9.5px -apple-system,sans-serif;fill:#8792a6}
  .num{font:800 12px -apple-system,sans-serif;fill:#0d0f14}
  @keyframes ring{0%,100%{opacity:.35}50%{opacity:1}}
  .pulse{animation:ring 1.4s ease-in-out infinite}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="load">⏳ Ачааллаж байна…</div>
</div>

<script>
(function(){
  var root = document.getElementById('root');

  // ── Зорилтот QPay хаяг (?u=) — зөвхөн qpay.mn домэйныг зөвшөөрнө ──
  var target = '';
  try {
    target = new URLSearchParams(location.search).get('u') || '';
  } catch(e) {}
  var okTarget = /^https:\/\/([a-z0-9-]+\.)?qpay\.mn\//i.test(target);

  function isInApp(){
    return /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Line\/|MicroMessenger/i.test(navigator.userAgent || '');
  }
  function isAndroid(){ return /Android/i.test(navigator.userAgent || ''); }

  if(!okTarget){
    root.innerHTML = '<h1>Холбоос буруу байна</h1>'
      + '<p class="sub">Төлбөрийн хуудсыг дахин нээнэ үү.</p>';
    return;
  }

  // ── ГАДААД БРАУЗЕР: шууд QPay руу ──
  // Хэрэглэгч ⋯ → "Open in external browser" дарж энэ хуудсыг Safari/Chrome-д
  // нээмэгц ямар ч нэмэлт даралтгүйгээр QPay-ийн 22 банкны жагсаалт руу
  // үсэрнэ. Тэндээс банкаа сонгоход апп шууд нээгдэнэ.
  if(!isInApp()){
    root.innerHTML = '<div class="load">✅ Банкны жагсаалт руу шилжиж байна…</div>';
    location.replace(target);
    return;
  }

  // ── Android дотоод цонх: intent:// -ээр гадаад браузер руу гаргана ──
  if(isAndroid()){
    var bare = target.replace(/^https?:\/\//, '');
    root.innerHTML = '<div class="load">✅ Браузер нээж байна…</div>';
    location.href = 'intent://' + bare + '#Intent;scheme=https;end';
    return;
  }

  // ── iPhone дотоод цонх: ЗУРГАН ЗААВАР ──
  // iOS дээр Meta-гийн цонхноос программаар гарах зам байхгүй нь
  // 2026-08-ны туршилтуудаар эцэслэн батлагдсан. Тиймээс хэрэглэгчид
  // ⋯ → "Open in external browser" алхмыг тод, ойлгомжтой зааж өгнө.
  root.innerHTML =
    '<h1>Банкны аппаараа төлөх</h1>'
  + '<p class="sub">Доорх 2 алхмыг хийхэд банкны жагсаалт нээгдэнэ</p>'
  + '<div class="card">'
  +   '<svg viewBox="0 0 300 250" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">'
  +     '<circle cx="14" cy="16" r="11" fill="#6ab7ff"/><text x="14" y="20" text-anchor="middle" class="num">1</text>'
  +     '<text x="32" y="20" class="lbl">Баруун дээд булангийн ⋯ дарна</text>'
  +     '<rect x="14" y="32" width="272" height="46" rx="10" fill="#1a1d24" stroke="#2b3242"/>'
  +     '<text x="30" y="60" class="txt" font-size="15">✕</text>'
  +     '<text x="150" y="52" text-anchor="middle" class="txt">🔒 qpay.mn</text>'
  +     '<text x="150" y="67" text-anchor="middle" class="dim">Messenger</text>'
  +     '<circle class="pulse" cx="264" cy="55" r="17" fill="none" stroke="#6ab7ff" stroke-width="2.5"/>'
  +     '<text x="264" y="61" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">⋯</text>'
  +     '<circle cx="14" cy="108" r="11" fill="#6ab7ff"/><text x="14" y="112" text-anchor="middle" class="num">2</text>'
  +     '<text x="32" y="112" class="lbl">Open in external browser сонгоно</text>'
  +     '<rect x="60" y="126" width="226" height="112" rx="12" fill="#1a1d24" stroke="#2b3242"/>'
  +     '<text x="76" y="148" class="dim">🔗  Copy link</text>'
  +     '<line x1="72" y1="158" x2="274" y2="158" stroke="#2b3242"/>'
  +     '<rect x="66" y="164" width="214" height="30" rx="8" fill="#6ab7ff" opacity=".18" stroke="#6ab7ff" stroke-width="1.5"/>'
  +     '<text x="80" y="184" fill="#8fc7ff" font-size="10.5" font-weight="700">🌐  Open in external browser</text>'
  +     '<line x1="72" y1="202" x2="274" y2="202" stroke="#2b3242"/>'
  +     '<text x="76" y="220" class="dim">⚙️  Settings</text>'
  +     '<path d="M46 179 L62 179 M56 173 L62 179 L56 185" stroke="#6ab7ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
  +   '</svg>'
  + '</div>'
  + '<p class="foot">Браузерт нээгдмэгц банкны жагсаалт өөрөө гарч ирнэ.<br>'
  + 'Банкаа сонгоход аппруу шууд орно.</p>';
})();
</script>
</body>
</html>
