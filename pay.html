<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Банкаар төлөх — Кино үзвэр</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:20px 16px 44px;background:#ffffff;color:#111827;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
  .wrap{max-width:400px;margin:0 auto}
  h1{font-size:19px;margin:0 0 6px;text-align:center;color:#111827}
  p.sub{font-size:13px;color:#6b7280;text-align:center;margin:0 0 18px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:10px 8px;
        box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .foot{font-size:12px;color:#6b7280;text-align:center;margin-top:16px;line-height:1.55}
  .load{text-align:center;padding:60px 0;color:#6b7280;font-size:14px}
  .err{text-align:center;padding:40px 0;color:#b91c1c;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="load">⏳ Ачааллаж байна…</div>
</div>

<script>
(function(){
  var root = document.getElementById('root');

  // ── Зорилтот QPay хаяг (?u=) — зөвхөн qpay.mn домэйныг зөвшөөрнө ──
  var target = '';
  try { target = new URLSearchParams(location.search).get('u') || ''; } catch(e) {}
  var okTarget = /^https:\/\/([a-z0-9-]+\.)?qpay\.mn\//i.test(target);

  function isInApp(){
    return /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Line\/|MicroMessenger/i.test(navigator.userAgent || '');
  }
  function isAndroid(){ return /Android/i.test(navigator.userAgent || ''); }

  if(!okTarget){
    root.innerHTML = '<div class="err">Холбоос буруу байна.<br>Төлбөрийн хуудсыг дахин нээнэ үү.</div>';
    return;
  }

  // ── ГАДААД БРАУЗЕР: шууд QPay руу ──
  // Хэрэглэгч ⋯ → "Open in external browser" дарж энэ хуудсыг Safari/Chrome-д
  // нээмэгц нэмэлт даралтгүйгээр 22 банкны жагсаалт руу үсэрнэ.
  if(!isInApp()){
    root.innerHTML = '<div class="load">✅ Банкны жагсаалт руу шилжиж байна…</div>';
    location.replace(target);
    return;
  }

  // ── Android дотоод цонх: intent:// -ээр гадаад браузер руу ──
  if(isAndroid()){
    var bare = target.replace(/^https?:\/\//, '');
    root.innerHTML = '<div class="load">✅ Браузер нээж байна…</div>';
    location.href = 'intent://' + bare + '#Intent;scheme=https;end';
    return;
  }

  // ══════════════════════════════════════════
  // iPhone дотоод цонх: 3 АЛХАМТ ЗУРГАН ЗААВАР
  //
  // iOS дээр Meta-гийн цонхноос программаар гарах зам байхгүй нь
  // 2026-08-ны туршилтуудаар эцэслэн батлагдсан. Тиймээс хэрэглэгчид
  // ⋯ → "Open in external browser" алхмыг утасных нь дэлгэц шиг
  // харагдуулж, улаан тэмдэглэгээ, сумаар алхам бүрийг заана.
  // ══════════════════════════════════════════
  var host = location.hostname;

  root.innerHTML =
    '<h1>Банкны аппаараа төлөх</h1>'
  + '<p class="sub">Доорх 3 алхмыг дагана уу</p>'
  + '<div class="card">'
  + '<svg viewBox="0 0 320 830" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">'
  +   '<defs>'
  +     '<style>'
  +       '.n{font:800 13px -apple-system,sans-serif;fill:#fff}'
  +       '.t{font:700 12.5px -apple-system,sans-serif;fill:#dc2626}'
  +       '.bar{font:500 11px -apple-system,sans-serif;fill:#e5e7eb}'
  +       '.dim{font:500 10px -apple-system,sans-serif;fill:#9ca3af}'
  +       '.mi{font:600 11px -apple-system,sans-serif;fill:#e5e7eb}'
  +       '.bk{font:600 7px -apple-system,sans-serif;fill:#374151}'
  +       '.qp{font:800 15px -apple-system,sans-serif;fill:#0ea5e9}'
  +       '@keyframes pp{0%,100%{opacity:.55}50%{opacity:1}}'
  +       '.pulse{animation:pp 1.3s ease-in-out infinite}'
  +     '</style>'
  +     '<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">'
  +       '<path d="M0 0 L9 4.5 L0 9 z" fill="#dc2626"/>'
  +     '</marker>'
  +   '</defs>'

  // ═════ АЛХАМ 1 ═════
  +   '<circle cx="16" cy="16" r="12" fill="#dc2626"/><text x="16" y="21" text-anchor="middle" class="n">1</text>'
  +   '<text x="36" y="21" class="t">Баруун дээд булангийн ⋯ дарна</text>'
  // утасны хүрээ
  +   '<rect x="26" y="36" width="268" height="86" rx="14" fill="#111827"/>'
  +   '<text x="46" y="72" class="bar" font-size="14">✕</text>'
  +   '<text x="160" y="66" text-anchor="middle" class="bar">🔒 ' + host + '</text>'
  +   '<text x="160" y="82" text-anchor="middle" class="dim">Messenger</text>'
  +   '<text x="268" y="73" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">⋯</text>'
  // улаан дугуй + хуруу
  +   '<ellipse class="pulse" cx="268" cy="68" rx="22" ry="19" fill="none" stroke="#dc2626" stroke-width="3"/>'
  +   '<text x="268" y="112" text-anchor="middle" font-size="20">👆</text>'

  // сум 1 → 2
  +   '<path d="M160 132 L160 158" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#ah)"/>'

  // ═════ АЛХАМ 2 ═════
  +   '<circle cx="16" cy="184" r="12" fill="#dc2626"/><text x="16" y="189" text-anchor="middle" class="n">2</text>'
  +   '<text x="36" y="189" class="t">Open in external browser сонгоно</text>'
  // цэсний хүрээ
  +   '<rect x="70" y="204" width="224" height="150" rx="14" fill="#111827"/>'
  +   '<text x="90" y="232" class="mi">🔗  Copy link</text>'
  +   '<line x1="84" y1="244" x2="280" y2="244" stroke="#374151"/>'
  +   '<rect x="78" y="252" width="208" height="34" rx="9" fill="#1e3a5f"/>'
  +   '<text x="94" y="274" fill="#93c5fd" font-size="11" font-weight="700">🌐  Open in external browser</text>'
  +   '<line x1="84" y1="296" x2="280" y2="296" stroke="#374151"/>'
  +   '<text x="90" y="320" class="mi">⚙️  Settings</text>'
  +   '<text x="90" y="344" class="mi">🔄  Reload</text>'
  // улаан дугуй + хуруу
  +   '<rect class="pulse" x="72" y="246" width="220" height="46" rx="12" fill="none" stroke="#dc2626" stroke-width="3"/>'
  +   '<text x="42" y="278" font-size="20">👉</text>'

  // сум 2 → 3
  +   '<path d="M160 364 L160 390" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#ah)"/>'

  // ═════ АЛХАМ 3 ═════
  +   '<circle cx="16" cy="416" r="12" fill="#dc2626"/><text x="16" y="421" text-anchor="middle" class="n">3</text>'
  +   '<text x="36" y="421" class="t">Банкаа сонгоод аппруу орно</text>'
  // qpay хуудасны хүрээ
  +   '<rect x="26" y="436" width="268" height="374" rx="14" fill="#111827"/>'
  +   '<text x="160" y="470" text-anchor="middle" class="qp">QPay</text>'
  +   '<line x1="42" y1="484" x2="278" y2="484" stroke="#374151"/>'
    // 22 банкны сүлжээ — 3 багана
  +   bankGrid()
  +   '<rect x="60" y="504" width="60" height="60" rx="14" fill="none" stroke="#dc2626" stroke-width="3" class="pulse"/>'
  + '</svg>'
  + '</div>'
  + '<p class="foot">Браузерт нээгдмэгц банкны жагсаалт өөрөө гарч ирнэ.<br>'
  + 'Банкаа сонгоход аппруу шууд орно.</p>';

  // 22 банкны товчийг зурна (өнгө нь бодит лого өнгөтэй ойролцоо)
  function bankGrid(){
    var banks = [
      ['#0d7a3a','Khan'],   ['#0ea5e9','TDB'],    ['#ffffff','Social'],
      ['#1e3a8a','State'],  ['#ffffff','Xac'],    ['#1e2a5a','Capitron'],
      ['#ffffff','Bogd'],   ['#dc2626','NIBank'], ['#ffffff','Most'],
      ['#1e3a5f','Trans'],  ['#10b981','M bank'], ['#ffffff','Arig'],
      ['#7c3aed','Chinggis'],['#1e1b4b','Monpay'],['#facc15','Toki'],
      ['#0891b2','Hipay'],  ['#ffffff','Sono'],   ['#0ea5e9','PayOn']
    ];
    var s = '', x0 = 60, y0 = 504, cw = 78, ch = 76, size = 60;
    for(var i = 0; i < banks.length; i++){
      var col = i % 3, row = Math.floor(i / 3);
      var x = x0 + col * cw, y = y0 + row * ch;
      s += '<rect x="' + x + '" y="' + y + '" width="' + size + '" height="' + size
         + '" rx="14" fill="' + banks[i][0] + '" stroke="#374151"/>';
      s += '<text x="' + (x + size/2) + '" y="' + (y + size + 11) + '" text-anchor="middle" class="bk" fill="#9ca3af">'
         + banks[i][1] + '</text>';
    }
    return s;
  }
})();
</script>
</body>
</html>
