<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nosnippet">
<title>Төлбөр — browser-ээр нээх</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1f9d5a;--text:#1d2420;--muted:#6b7772;--line:#e3e8e5;--soft:#f5f7f6;--font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#fff;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:center;gap:10px;height:52px;padding:0 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
  .back{width:40px;height:40px;border:0;background:transparent;border-radius:10px;font-size:22px;line-height:1;color:var(--text);cursor:pointer}
  .back:active{background:var(--soft)}
  .top b{font-size:15px;font-weight:600}
  .wrap{max-width:440px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:20px;line-height:1.25;margin:4px 0 6px;font-weight:700;color:#111}
  p.sub{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 16px}
  .ill{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);margin-bottom:16px}
  .ill svg{display:block;width:100%;height:auto}
  ol{list-style:none;margin:0 0 18px;padding:0}
  li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
  li:first-child{border-top:0}
  li b{color:#111}
  .n{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
  .btn{display:block;width:100%;border:1px solid var(--line);background:#fff;color:var(--text);font:600 14px var(--font);padding:12px;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none}
  .btn:active{background:var(--soft)}
  .foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
  /* Хэрэглэгчийн БОДИТ ⋯ товч руу заасан хуруу — Messenger-ийн цонхны баруун дээд булан */
  .hand{position:fixed;top:4px;right:10px;z-index:50;text-align:center;pointer-events:none;animation:up 1.3s ease-in-out infinite}
  .hand .em{font-size:38px;line-height:1;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .hand .lb{display:block;font-size:10px;font-weight:700;color:var(--accent);margin-top:-2px;background:#fff;border-radius:6px;padding:1px 5px}
  @keyframes up{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .state{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="root"><div class="state">⏳ Ачааллаж байна…</div></div>

<script>
(function(){
  var root = document.getElementById('root');
  var target = '';
  try { target = new URLSearchParams(location.search).get('u') || ''; } catch(e) {}
  var okTarget = /^https:\/\/([a-z0-9-]+\.)?qpay\.mn\//i.test(target);

  function isInApp(){ return /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|Line\/|MicroMessenger/i.test(navigator.userAgent || ''); }
  function isAndroid(){ return /Android/i.test(navigator.userAgent || ''); }
  function back(){ if(history.length > 1) history.back(); else location.href = '/beta.html'; }
  window.payBack = back;

  if(!okTarget){
    root.innerHTML = '<div class="top"><button class="back" onclick="payBack()">←</button><b>Төлбөр</b></div><div class="state">Холбоос буруу байна.<br>Төлбөрийн цонхоо дахин нээнэ үү.</div>';
    return;
  }
  // Жинхэнэ browser (Safari/Chrome): QPay-ийн банкны жагсаалт руу шууд
  if(!isInApp()){
    root.innerHTML = '<div class="state">✅ Банкны жагсаалт руу шилжиж байна…</div>';
    location.replace(target);
    return;
  }
  // Android дотоод цонх: системийн browser-ийг intent-ээр нээнэ
  if(isAndroid()){
    root.innerHTML = '<div class="state">✅ Browser нээж байна…</div>';
    location.href = 'intent://' + target.replace(/^https?:\/\//, '') + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
    return;
  }

  // iPhone дотоод цонх: бүтэн хуудас заавар (⋯ → Open in external browser → банкны жагсаалт)
  var host = location.hostname;
  root.innerHTML =
      '<div class="hand"><span class="em">👆</span><span class="lb">эндээс</span></div>'
    + '<div class="top"><button class="back" onclick="payBack()">←</button><b>Browser-ээр нээж төлөх</b></div>'
    + '<div class="wrap">'
    + '<h1>Банкаа сонгохын тулд хөтөч ашиглана уу</h1>'
    + '<p class="sub">Хоёр даралт л хангалттай. Ердөө 5 секунд.</p>'
    + '<div class="ill"><svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">'
    +   '<rect width="360" height="170" fill="#f5f7f6"/>'
    +   '<rect x="12" y="12" width="336" height="32" rx="9" fill="#e8ece9"/>'
    +   '<text x="28" y="32" font-size="12" fill="#6b7772" font-family="Inter,system-ui">✕</text>'
    +   '<text x="180" y="32" text-anchor="middle" font-size="11.5" fill="#3b4540" font-family="Inter,system-ui">🔒 ' + host + '</text>'
    +   '<circle cx="326" cy="28" r="14" fill="none" stroke="#1f9d5a" stroke-width="2.5"/>'
    +   '<text x="326" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#111" font-family="Inter,system-ui">⋯</text>'
    +   '<path d="M326 48 L326 70" stroke="#1f9d5a" stroke-width="2" stroke-dasharray="3 3"/>'
    +   '<rect x="168" y="72" width="180" height="86" rx="11" fill="#fff" stroke="#e3e8e5"/>'
    +   '<text x="184" y="94" font-size="11" fill="#3b4540" font-family="Inter,system-ui">🔗 Copy link</text>'
    +   '<rect x="174" y="104" width="168" height="24" rx="7" fill="#1f9d5a"/>'
    +   '<text x="258" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Inter,system-ui">🌐 Open in external browser</text>'
    +   '<text x="184" y="148" font-size="11" fill="#8b958f" font-family="Inter,system-ui">🔄 Reload</text>'
    +   '<rect x="12" y="56" width="140" height="102" rx="9" fill="#fff"/>'
    +   '<rect x="24" y="70" width="70" height="7" rx="3.5" fill="#e3e8e5"/><rect x="24" y="86" width="104" height="7" rx="3.5" fill="#e3e8e5"/><rect x="24" y="102" width="84" height="7" rx="3.5" fill="#e3e8e5"/><rect x="24" y="118" width="96" height="7" rx="3.5" fill="#e3e8e5"/>'
    + '</svg></div>'
    + '<ol>'
    +   '<li><span class="n">1</span><span>Дэлгэцийн <b>баруун дээд буланд ⋯</b> (3 цэг) дарна</span></li>'
    +   '<li><span class="n">2</span><span><b>«Open in external browser»</b> сонгоно</span></li>'
    +   '<li><span class="n">3</span><span>Нээгдсэн browser дээр QPay-ийн <b>банкны жагсаалт</b> гарна — банкаа сонгоод төлнө</span></li>'
    + '</ol>'
    + '<button class="btn" id="copy">Линк хуулах</button>'
    + '<p class="foot">Төлсний дараа Messenger рүү буцахад эрх автоматаар нээгдсэн байна.</p>'
    + '</div>';
  document.getElementById('copy').onclick = function(){
    var b = this;
    function done(){ b.textContent = 'Хуулагдлаа ✓ — Safari-д буулгана уу'; setTimeout(function(){ b.textContent = 'Линк хуулах'; }, 3000); }
    if(navigator.clipboard) navigator.clipboard.writeText(target).then(done, done); else done();
  };
})();
</script>
</body>
</html>
