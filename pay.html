<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Банкаар төлөх — Кино үзвэр</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;padding:14px 12px;background:#fff;color:#111827;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.4;
       display:flex;flex-direction:column;justify-content:center}
  .wrap{max-width:440px;margin:0 auto;width:100%}
  h1{font-size:17px;margin:0 0 3px;text-align:center}
  p.sub{font-size:12px;color:#6b7280;text-align:center;margin:0 0 12px}
  .foot{font-size:11.5px;color:#6b7280;text-align:center;margin-top:12px;line-height:1.5}
  .load{text-align:center;padding:60px 0;color:#6b7280;font-size:14px}
  .err{text-align:center;padding:40px 0;color:#b91c1c;font-size:14px}
  svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="load">⏳ Ачааллаж байна…</div>
</div>

<script>
(function(){
  var root = document.getElementById('root');

  var target = '';
  try { target = new URLSearchParams(location.search).get('u') || ''; } catch(e) {}
  var okTarget = /^https:\/\/([a-z0-9-]+\.)?qpay\.mn\//i.test(target);

  function isInApp(){
    return /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Line\/|MicroMessenger/i.test(navigator.userAgent || '');
  }
  function isAndroid(){ return /Android/i.test(navigator.userAgent || ''); }

  if(!okTarget){
    root.innerHTML = '<div class="err">Холбоос буруу байна.<br>Төлбөрийн хуудсыг дахин нээнэ үү.</div>';
    return;
  }

  // ── ГАДААД БРАУЗЕР: шууд QPay руу ──
  if(!isInApp()){
    root.innerHTML = '<div class="load">✅ Банкны жагсаалт руу шилжиж байна…</div>';
    location.replace(target);
    return;
  }

  // ── Android дотоод цонх: intent:// -ээр гадаад браузер руу ──
  if(isAndroid()){
    var bare = target.replace(/^https?:\/\//, '');
    root.innerHTML = '<div class="load">✅ Браузер нээж байна…</div>';
    location.href = 'intent://' + bare + '#Intent;scheme=https;end';
    return;
  }

  // ══════════════════════════════════════════
  // iPhone дотоод цонх: 3 УТАС ЗЭРЭГЦЭЭ
  //
  // Гурван алхмыг гар утасны бүтэн дэлгэц шиг мокапаар харуулж, улаан
  // сумаар холбоно. Босоо биш ХӨНДЛӨН байрлуулснаар нэг дэлгэцэд багтаж,
  // хэрэглэгч гүйлгэх шаардлагагүй.
  // ══════════════════════════════════════════
  var host = location.hostname;

  // QPay-ийн бодит банкны логонууд (3-р дэлгэцэд)
  var LOGOS = [
    'khanbank','tdbbank','socialpay','state_3','xacbank','capitronbank',
    'bogdbank','nibank.jpeg','most','transbank','mbank','arig'
  ].map(function(n){
    return 'https://qpay.mn/q/logo/' + (n.indexOf('.') > 0 ? n : n + '.png');
  });

  // Нэг утасны хүрээ зурна
  function phone(x, y, w, h, inner){
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="12" '
         + 'fill="#0f1115" stroke="#d1d5db" stroke-width="1.5"/>'
         + '<rect x="' + (x + w/2 - 12) + '" y="' + (y + 4) + '" width="24" height="3.5" rx="1.75" fill="#374151"/>'
         + inner;
  }

  // 3-р дэлгэцийн банкны сүлжээ (бодит логотой)
  function bankGrid(x, y, w){
    var s = '', cols = 3, pad = 7, gap = 5;
    var cell = (w - pad*2 - gap*(cols-1)) / cols;
    for(var i = 0; i < LOGOS.length; i++){
      var c = i % cols, r = Math.floor(i / cols);
      var bx = x + pad + c * (cell + gap);
      var by = y + r * (cell + gap + 5);
      s += '<rect x="' + bx + '" y="' + by + '" width="' + cell + '" height="' + cell
         + '" rx="6" fill="#fff"/>'
         + '<image href="' + LOGOS[i] + '" x="' + (bx+1.5) + '" y="' + (by+1.5) + '" '
         + 'width="' + (cell-3) + '" height="' + (cell-3) + '" preserveAspectRatio="xMidYMid meet"/>';
    }
    return s;
  }

  var PW = 104, PH = 196;            // утасны хэмжээ
  var X1 = 4, X2 = 128, X3 = 252;    // 3 утасны байрлал
  var PY = 30;

  root.innerHTML =
    '<h1>Банкны аппаараа төлөх</h1>'
  + '<p class="sub">Доорх 3 алхмыг дагана уу</p>'
  + '<svg viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg">'
  +   '<defs><style>'
  +     '.n{font:800 11px -apple-system,sans-serif;fill:#fff}'
  +     '.cap{font:700 9.5px -apple-system,sans-serif;fill:#dc2626}'
  +     '.b{font:500 6.5px -apple-system,sans-serif;fill:#d1d5db}'
  +     '.d{font:500 5.5px -apple-system,sans-serif;fill:#9ca3af}'
  +     '.m{font:600 6px -apple-system,sans-serif;fill:#e5e7eb}'
  +     '@keyframes pp{0%,100%{opacity:.5}50%{opacity:1}}'
  +     '.pulse{animation:pp 1.3s ease-in-out infinite}'
  +   '</style>'
  +   '<marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">'
  +     '<path d="M0 0 L8 4 L0 8 z" fill="#dc2626"/></marker>'
  +   '</defs>'

  // ───── 1-р утас: ⋯ дарах ─────
  +   '<circle cx="' + (X1+9) + '" cy="9" r="8.5" fill="#dc2626"/>'
  +   '<text x="' + (X1+9) + '" y="12.5" text-anchor="middle" class="n">1</text>'
  +   '<text x="' + (X1+22) + '" y="12.5" class="cap">⋯ дарна</text>'
  +   phone(X1, PY, PW, PH,
        '<rect x="' + (X1+5) + '" y="' + (PY+12) + '" width="' + (PW-10) + '" height="26" rx="6" fill="#1f2937"/>'
      + '<text x="' + (X1+13) + '" y="' + (PY+29) + '" class="b" font-size="8">✕</text>'
      + '<text x="' + (X1+PW/2) + '" y="' + (PY+24) + '" text-anchor="middle" class="b">🔒 ' + host + '</text>'
      + '<text x="' + (X1+PW/2) + '" y="' + (PY+33) + '" text-anchor="middle" class="d">Messenger</text>'
      + '<text x="' + (X1+PW-14) + '" y="' + (PY+29) + '" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">⋯</text>'
      + '<ellipse class="pulse" cx="' + (X1+PW-14) + '" cy="' + (PY+25) + '" rx="13" ry="11" fill="none" stroke="#dc2626" stroke-width="2.2"/>'
      + '<text x="' + (X1+PW-14) + '" y="' + (PY+52) + '" text-anchor="middle" font-size="14">👆</text>'
      + '<rect x="' + (X1+10) + '" y="' + (PY+64) + '" width="' + (PW-20) + '" height="5" rx="2.5" fill="#1f2937"/>'
      + '<rect x="' + (X1+10) + '" y="' + (PY+74) + '" width="' + (PW-34) + '" height="5" rx="2.5" fill="#1f2937"/>'
      + '<rect x="' + (X1+10) + '" y="' + (PY+90) + '" width="' + (PW-20) + '" height="46" rx="6" fill="#161a22"/>'
      + '<rect x="' + (X1+10) + '" y="' + (PY+142) + '" width="' + (PW-20) + '" height="5" rx="2.5" fill="#1f2937"/>')

  +   '<path d="M' + (X1+PW+4) + ' ' + (PY+PH/2) + ' L' + (X2-6) + ' ' + (PY+PH/2) + '" '
  +     'stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>'

  // ───── 2-р утас: цэснээс сонгох ─────
  +   '<circle cx="' + (X2+9) + '" cy="9" r="8.5" fill="#dc2626"/>'
  +   '<text x="' + (X2+9) + '" y="12.5" text-anchor="middle" class="n">2</text>'
  +   '<text x="' + (X2+22) + '" y="12.5" class="cap">Open in external</text>'
  +   phone(X2, PY, PW, PH,
        '<rect x="' + (X2+5) + '" y="' + (PY+12) + '" width="' + (PW-10) + '" height="20" rx="5" fill="#1f2937" opacity=".5"/>'
      + '<rect x="' + (X2+8) + '" y="' + (PY+42) + '" width="' + (PW-16) + '" height="98" rx="8" fill="#1f2937"/>'
      + '<text x="' + (X2+16) + '" y="' + (PY+57) + '" class="m">🔗 Copy link</text>'
      + '<line x1="' + (X2+12) + '" y1="' + (PY+64) + '" x2="' + (X2+PW-12) + '" y2="' + (PY+64) + '" stroke="#374151"/>'
      + '<rect x="' + (X2+11) + '" y="' + (PY+69) + '" width="' + (PW-22) + '" height="20" rx="5" fill="#1e3a5f"/>'
      + '<text x="' + (X2+16) + '" y="' + (PY+82) + '" fill="#93c5fd" font-size="5.6" font-weight="700">🌐 Open in external browser</text>'
      + '<line x1="' + (X2+12) + '" y1="' + (PY+95) + '" x2="' + (X2+PW-12) + '" y2="' + (PY+95) + '" stroke="#374151"/>'
      + '<text x="' + (X2+16) + '" y="' + (PY+108) + '" class="m">⚙️ Settings</text>'
      + '<line x1="' + (X2+12) + '" y1="' + (PY+115) + '" x2="' + (X2+PW-12) + '" y2="' + (PY+115) + '" stroke="#374151"/>'
      + '<text x="' + (X2+16) + '" y="' + (PY+130) + '" class="m">🔄 Reload</text>'
      + '<rect class="pulse" x="' + (X2+8) + '" y="' + (PY+66) + '" width="' + (PW-16) + '" height="26" rx="7" fill="none" stroke="#dc2626" stroke-width="2.2"/>'
      + '<text x="' + (X2+PW-6) + '" y="' + (PY+85) + '" font-size="13">👉</text>')

  +   '<path d="M' + (X2+PW+4) + ' ' + (PY+PH/2) + ' L' + (X3-6) + ' ' + (PY+PH/2) + '" '
  +     'stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>'

  // ───── 3-р утас: QPay-ийн банкны жагсаалт ─────
  +   '<circle cx="' + (X3+9) + '" cy="9" r="8.5" fill="#dc2626"/>'
  +   '<text x="' + (X3+9) + '" y="12.5" text-anchor="middle" class="n">3</text>'
  +   '<text x="' + (X3+22) + '" y="12.5" class="cap">Банкаа сонгоно</text>'
  +   phone(X3, PY, PW, PH,
        '<text x="' + (X3+PW/2) + '" y="' + (PY+24) + '" text-anchor="middle" fill="#0ea5e9" font-size="11" font-weight="800">QPay</text>'
      + '<line x1="' + (X3+8) + '" y1="' + (PY+31) + '" x2="' + (X3+PW-8) + '" y2="' + (PY+31) + '" stroke="#374151"/>'
      + bankGrid(X3, PY+38, PW)
      + '<rect class="pulse" x="' + (X3+6) + '" y="' + (PY+37) + '" width="30" height="30" rx="7" fill="none" stroke="#dc2626" stroke-width="2.2"/>')
  + '</svg>'
  + '<p class="foot">Браузерт нээгдмэгц банкны жагсаалт өөрөө гарна.<br>'
  + 'Банкаа сонгоход аппруу шууд орно.</p>';
})();
</script>
</body>
</html>
